[package]
name = "nv-core"
version = "0.1.0"
description = "Notivelo's Core API (docs/ARCHITECTURE.md 3.3): the typed boundary the native apps call, exported with uniffi"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# staticlib: the Apple XCFramework (build-xcframework.sh); cdylib: Android, and uniffi's library-mode bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
# The uniffi-bindgen binary (src/bin/uniffi-bindgen.rs), only needed to generate bindings.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
nv-api = { path = "../nv-api" }
nv-editor = { path = "../nv-editor" }
nv-ink = { path = "../nv-ink" }
nv-model = { path = "../nv-model" }
nv-sync = { path = "../nv-sync" }
nv-store = { path = "../nv-store" }
# Random task ids (UUIDs); already in the build through ring.
getrandom = "0.2"
serde_json = "1"
uniffi = "0.32"
regex = "1"

[dev-dependencies]
# For the stand-in collab server (crates/nv-sync/tests/support) in tests/live.rs.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
