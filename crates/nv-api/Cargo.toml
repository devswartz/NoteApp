[package]
name = "nv-api"
version = "0.1.0"
description = "Notivelo's typed REST client: sign-in, token refresh, workspaces, tree, tasks, pages (docs/ARCHITECTURE.md 3.4)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP with rustls (ring): no async runtime in the core, TLS that builds for every target.
ureq = { version = "3", default-features = false, features = ["rustls"] }
