[package]
name = "nv-api"
version = "0.1.0"
description = "Notivelo's typed REST client: sign-in, token refresh, workspaces, tree, tasks, pages (docs/ARCHITECTURE.md 3.4)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
# HMAC-SHA-256 for signed file links; already in the build through rustls.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP with rustls (ring): no async runtime in the core, TLS that builds for every target.
# Certificates are checked by the system (rustls-platform-verifier), not a bundled root list.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
