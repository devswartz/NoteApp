# Marketing site for notiveloapp.com. Static only -- no app code, no secrets.
# Built into the notivelo-site image (site/Dockerfile); reached only through the
# Cloudflare Tunnel. /download/ is a host volume the homelab keeps in sync.

server {
    listen 80;
    server_name www.notiveloapp.com;
    # Canonical host is the apex, so www is folded into it rather than serving
    # a duplicate copy. Devon's Cloudflare Single Redirect previously sent both
    # apex and www to the app; once that rule is off, this takes over for www.
    return 301 https://notiveloapp.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx builds its own redirects (notably the directory redirect that sends
    # /guide to /guide/) from the LISTENING socket's scheme. Behind the tunnel
    # that is plain http, so those came out as http:// and cost the visitor an
    # extra hop through the https upgrade below. Relative Location headers keep
    # the browser on whatever scheme it already used.
    absolute_redirect off;
    port_in_redirect off;

    # The zone is not set to force HTTPS at the edge, and the Single Redirect
    # rule that used to do it for the apex was removed at cutover, so a plain
    # http:// visitor was being served the site over plaintext. cloudflared
    # passes the visitor's original scheme in X-Forwarded-Proto; the header is
    # absent for the container's own loopback healthcheck, so that still works.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Tunnel health probe; never needs to be public-cached.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Clean URLs: /guide works, /guide.html and /guide/ both land there too.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fingerprinted assets are safe to cache hard; everything else stays short
    # so a content fix goes live without waiting on an edge purge.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Desktop installers, mirrored from the GitHub release by
    # sync-downloads.sh. Stable filenames, so the download page's links never
    # change; a short cache so a new release reaches people quickly while still
    # sparing the home upstream most repeat downloads.
    location /download/ {
        alias /srv/downloads/;
        autoindex off;
        types {
            application/json                 json;
            application/x-apple-diskimage    dmg;
            application/x-msdownload         exe;
            application/x-msi                msi;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=900" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Dotfiles here are sync bookkeeping (.synced-tag), never public.
        location ~ /\. { deny all; }
    }

    # Reachable directly as /404, but it must not answer 200 there: that is a
    # soft 404 and search engines treat it as a real page.
    location = /404 { return 404; }

    # Bare directory requests (/assets/, /download/) and the denied dotfiles
    # would otherwise answer 403, which tells a crawler the path exists but is
    # forbidden. 404 is both tidier and less revealing.
    error_page 403 =404 /404.html;
    error_page 404 /404.html;
    location = /404.html { internal; }

    # The site is self-contained: own CSS/JS/fonts/images, no third-party
    # requests, no inline script. form-action allows the sign-up hand-off to
    # the real app. frame-ancestors 'none' blocks clickjacking.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; form-action https://app.notiveloapp.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    access_log /var/log/nginx/access.log;
}
