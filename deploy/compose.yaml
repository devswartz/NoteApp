# NoteApp: one environment (staging OR prod). Contract: docs/DEPLOY_CONTRACT.md
#
# Layout on the host, one directory per environment:
#   /opt/noteapp/staging/{compose.yaml,.env}
#   /opt/noteapp/prod/{compose.yaml,.env}
# Copy this file into each directory unchanged; everything that differs between
# environments lives in that directory's .env (start from .env.example).
#
#   docker compose pull && docker compose up -d     # deploy / update
#   docker compose logs -f app                      # logs
#   docker compose ps                               # health status

name: noteapp-${NOTEAPP_ENV:?set NOTEAPP_ENV in .env (staging or prod)}

services:
  app:
    # staging follows :staging, prod follows :prod. To roll back, pin a
    # specific tag in .env (e.g. NOTEAPP_TAG=v1.2.3 or sha-abc1234).
    image: ghcr.io/devswartz/noteapp:${NOTEAPP_TAG:?set NOTEAPP_TAG in .env}
    restart: unless-stopped
    init: true                    # forwards SIGTERM and reaps zombies
    stop_grace_period: 15s        # the app flushes and exits within 10 s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATA_DIR: /data
      # Fails `docker compose up` if JWT_SECRET is missing or blank in .env.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 64)}
    volumes:
      - data:/data
    ports:
      # Only cloudflared may reach this port (see DEPLOY_CONTRACT: Network).
      # cloudflared on this host: keep BIND_ADDR=127.0.0.1 (the default).
      # cloudflared on another host: BIND_ADDR=0.0.0.0 (or this host's LAN IP) AND a
      # host firewall (e.g. iptables DOCKER-USER) that admits only the cloudflared host.
      # Use a different HOST_PORT per environment (e.g. staging 3002, prod 3001).
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Named volume, created owned by UID 1000 (the app user). Holds
  # noteapp.db (SQLite, WAL) and files/. Back it up with `sqlite3 .backup`
  # or Litestream, never by copying the DB file while the app runs.
  # To use a host directory instead, replace `data:/data` above with
  # `./data:/data` and run `sudo chown -R 1000:1000 ./data` first.
  data:
