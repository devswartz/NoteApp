<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Icons: public/icon.svg is the source; `npm run web:icons` regenerates public/icons/. -->
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Notes and tasks, beautifully together. Notebooks, sections and pages with tasks that live in your notes." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Notivelo" />
    <meta property="og:title" content="Notivelo: notes and tasks, beautifully together" />
    <meta property="og:description" content="Notebooks, sections and pages on a free-form canvas, with tasks, a calendar and sharing built in." />
    <meta property="og:image" content="https://notes.devswartz.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Notivelo: notes and tasks, beautifully together" />
    <meta name="twitter:description" content="Notebooks, sections and pages on a free-form canvas, with tasks, a calendar and sharing built in." />
    <meta name="twitter:image" content="https://notes.devswartz.com/og-image.png" />
    <title>%APP_NAME%</title>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
