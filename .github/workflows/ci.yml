name: CI

# What runs when:
#   pull_request   check ∥ docker ∥ e2e (2 shards in parallel) -> "e2e" summary. Nothing is published.
#   push to main   check ∥ docker -> publish :staging -> verify deploy. No e2e: the pull request that produced
#                  the merge just ran it, so it would only repeat it.
#   push of a tag  docker -> publish :prod -> verify deploy. No check and no e2e: a release tag points at a commit
#                  main has already tested (and its docker build still has to pass before anything is published).
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

# A new push to a PR cancels that PR's run in progress. Pushes to main and
# tags never cancel each other (each one may publish an image). A tag and the main
# commit it points at share a group, so the tag run waits for main's (now short) run.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Require this job ("check") in branch protection for `main`.
  # Skipped on tags: main already ran it for the same commit.
  check:
    name: check
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # Builds the production image (no push) so Dockerfile breakage shows up on
  # the PR, not after merge. Layers are cached in the GitHub Actions cache.
  # Runs on every event, tags included: publish waits for it.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=noteapp
            type=gha,scope=noteapp-ci
          cache-to: type=gha,mode=max,scope=noteapp-ci

  # ---------------------------------------------------------------------------
  # E2E — the Playwright suite (tests/e2e/), pull requests only, in two shards that run in
  # parallel with `check` (it builds the app itself: playwright.config.ts' webServer runs
  # `npm run build && npm start`, so it doesn't wait for `check`). The "e2e" job below is the
  # one status to require: it passes only if both shards did.
  # ---------------------------------------------------------------------------
  e2e-shards:
    name: e2e shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # let the other shard finish: a failure in one shouldn't hide the other's
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # 'playwright install --with-deps' hung for 20 minutes several times on the Ubuntu apt
      # mirror. GitHub's Ubuntu runners already ship Chrome and the libraries it needs, so only
      # the browser is downloaded (from Playwright's CDN, cached per version). The system packages
      # are installed only if Chromium then fails to launch, and every download is time-limited.
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium (browser only)
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install chromium; then exit 0; fi
            echo "::warning::Chromium download attempt $attempt failed or timed out; retrying"
            sleep 5
          done
          exit 1

      - name: Check Chromium launches (install system packages only if needed)
        timeout-minutes: 12
        run: |
          probe='require("@playwright/test").chromium.launch().then(b => b.close())'
          if node -e "$probe"; then exit 0; fi
          echo "::warning::Chromium needs system packages on this runner; installing them"
          for attempt in 1 2; do
            if timeout 300 npx playwright install-deps chromium; then node -e "$probe" && exit 0; fi
            echo "::warning::install-deps attempt $attempt failed or timed out"
          done
          exit 1

      - run: npx playwright test --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Artifact names can't contain "/": one report per shard.
          name: playwright-report-shard-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # The single "e2e" status (what branch protection can require): green only if every shard passed.
  e2e:
    name: e2e
    needs: e2e-shards
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.e2e-shards.result }}" != "success" ]; then
            echo "::error::e2e shards: ${{ needs.e2e-shards.result }}"
            exit 1
          fi

  # Publishes to GHCR only after the checks passed. main -> :staging + :sha-<short>;
  # tag vX.Y.Z -> :vX.Y.Z + :prod. See .github/workflows/publish.yml.
  # On a tag `check` is skipped on purpose (main tested that commit), so skipped counts as passed there only;
  # on main it must have succeeded. There is no e2e on pushes.
  publish:
    name: publish
    needs: [check, docker]
    if: >-
      github.event_name == 'push' && !cancelled() &&
      needs.docker.result == 'success' &&
      (needs.check.result == 'success' || (startsWith(github.ref, 'refs/tags/v') && needs.check.result == 'skipped'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml

  # After an image is published, the homelab's update timer (deploy/systemd) should pull it
  # within about 5 minutes. Fail loudly if the server doesn't report the new build, so a
  # release can't quietly leave prod (or staging) behind the apps.
  verify-deploy:
    name: verify deploy
    needs: publish
    # always(): on a tag `check` is skipped, and a skipped job anywhere upstream makes the implicit success() false,
    # which skipped this job too (v0.4.5). The explicit result test below is the real condition.
    if: ${{ always() && github.event_name == 'push' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for the server to run this build
        env:
          URL: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://app.notiveloapp.com' || 'https://staging.notiveloapp.com' }}
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 80); do
            got=$(curl -fsS -m 10 "$URL/api/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            if [ "${got::7}" = "$want" ]; then echo "$URL runs $want"; exit 0; fi
            echo "[$i] $URL runs '${got:-unreachable}', waiting for $want"
            sleep 15
          done
          echo "::error::$URL still runs '${got:-unreachable}' 20 minutes after $want was published. Check the noteapp-update timer on the homelab (deploy/README.md)."
          exit 1
