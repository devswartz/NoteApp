name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

# A new push to a PR cancels that PR's run in progress. Pushes to main and
# tags never cancel each other (each one may publish an image).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Require this job ("check") in branch protection for `main`.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_e2e: ${{ steps.e2e.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Detect E2E suite
        id: e2e
        run: |
          if [ -d tests/e2e ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  # Builds the production image (no push) so Dockerfile breakage shows up on
  # the PR, not after merge. Layers are cached in the GitHub Actions cache.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=noteapp
            type=gha,scope=noteapp-ci
          cache-to: type=gha,mode=max,scope=noteapp-ci

  # ---------------------------------------------------------------------------
  # E2E SLOT — Playwright suite owned by the QA agent (tests/e2e/).
  # Skipped automatically until tests/e2e/ exists. Expects @playwright/test in
  # devDependencies and a playwright.config.ts (its `webServer` should start
  # the app, e.g. `npm run build && npm start`).
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    needs: check
    if: needs.check.outputs.has_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The browser download (and its apt packages) has hung on GitHub runners more than once,
      # stalling e2e until the 20-minute job limit. Cache the browser per Playwright version, and
      # give the install a short timeout with retries so a stuck download fails fast.
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright browser and system deps
        timeout-minutes: 12
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            cmd="npx playwright install-deps chromium"   # browser cached: only the OS packages
          else
            cmd="npx playwright install --with-deps chromium"
          fi
          for attempt in 1 2 3; do
            if timeout 240 $cmd; then exit 0; fi
            echo "::warning::Playwright install attempt $attempt failed or timed out; retrying"
            sleep 5
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      - run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publishes to GHCR only after every check above passed (e2e may be skipped
  # while the suite doesn't exist). main -> :staging + :sha-<short>;
  # tag vX.Y.Z -> :vX.Y.Z + :prod. See .github/workflows/publish.yml.
  publish:
    name: publish
    needs: [check, docker, e2e]
    if: >-
      github.event_name == 'push' && !cancelled() &&
      needs.check.result == 'success' && needs.docker.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
