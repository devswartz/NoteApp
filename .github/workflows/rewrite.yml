name: Rewrite

# Checks for the native rewrite (docs/rewrite/PLAN.md) that run on its branches only.
#   editor suite   the editor scenarios (tests/editor/scenarios) against today's TipTap editor,
#                  headless in Chromium (tests/editor/run-tiptap.ts). nv-editor runs the same
#                  scenarios in Rust (rust.yml).
on:
  push:
    branches: ['rewrite/**']
    paths:
      - 'tests/editor/**'
      - 'src/editor/**'
      - 'src/styles/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rewrite.yml'
  pull_request:
    branches: ['rewrite/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewrite-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  editor-suite:
    name: editor suite (TipTap)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # As in ci.yml's e2e job: download only the browser (cached per version), and install system
      # packages only if Chromium then fails to launch, every download time-limited.
      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium (browser only)
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 180 npx playwright install chromium; then exit 0; fi
            echo "::warning::Chromium download attempt $attempt failed or timed out; retrying"
            sleep 5
          done
          exit 1

      - name: Check Chromium launches (install system packages only if needed)
        timeout-minutes: 12
        run: |
          probe='require("@playwright/test").chromium.launch().then(b => b.close())'
          if node -e "$probe"; then exit 0; fi
          echo "::warning::Chromium needs system packages on this runner; installing them"
          for attempt in 1 2; do
            if timeout 300 npx playwright install-deps chromium; then node -e "$probe" && exit 0; fi
            echo "::warning::install-deps attempt $attempt failed or timed out"
          done
          exit 1

      - run: node --import tsx tests/editor/run-tiptap.ts
