name: Rust

# The Rust core (crates/, docs/ARCHITECTURE.md 3.3). Runs beside CI's check/docker/e2e jobs, not
# before them, so it adds no wall-clock time to a pull request.
#   rust      cargo fmt --check, clippy -D warnings, cargo test (unit + property tests).
#   ink wasm  rebuilds the ink engine's WASM and JS glue (scripts/build-ink-wasm.sh) and fails if the
#             committed files in src/ink/generated/ differ from the source, or if it outgrows its
#             size budget. The web, Docker and app builds use the committed files and need no Rust.
#             When it fails because the files differ, the job's `ink-wasm` artifact holds the right
#             ones: copy them into src/ink/generated/ and commit.
#   ink ios   (macOS) builds the engine's C ABI for iOS as an XCFramework (scripts/build-ink-ios.sh)
#             and runs the iPad pen layer's Swift tests (apps/mobile/ios/App/NvInk, `swift test`).
#             The Mobile workflow builds the same framework before building the app.
# Fuzzing (crates/nv-ink/fuzz, cargo +nightly fuzz run decode) runs by hand, not here.
# Pull requests, and any push (a branch before it has a PR, main after a merge) that touches the Rust core or its build.
on:
  pull_request:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/ink/generated/**'
      - 'scripts/build-ink-wasm.sh'
      - 'scripts/build-ink-ios.sh'
      - 'apps/mobile/ios/App/NvInk/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned: the committed WASM must be reproducible. Change both together with a rebuild of src/ink/generated.
  RUST_TOOLCHAIN: '1.99.1'
  WASM_BINDGEN_VERSION: '0.2.130'
  # The whole core's WASM (gzipped) must stay under 1.5 MB (PLAN_INK); the ink engine alone gets 300 KB.
  INK_WASM_GZ_BUDGET: '307200'
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  ink-wasm:
    name: ink wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}

      - name: Build the ink engine to WASM
        run: bash scripts/build-ink-wasm.sh

      - name: Size budget
        run: |
          gz=$(gzip -9 -n -c src/ink/generated/nv_ink_bg.wasm | wc -c)
          echo "nv_ink_bg.wasm: $(wc -c < src/ink/generated/nv_ink_bg.wasm) bytes, $gz gzipped (budget $INK_WASM_GZ_BUDGET)"
          echo "### Ink WASM: $gz bytes gzipped (budget $INK_WASM_GZ_BUDGET)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$gz" -gt "$INK_WASM_GZ_BUDGET" ]; then echo "::error::The ink WASM is $gz bytes gzipped, over its $INK_WASM_GZ_BUDGET budget"; exit 1; fi

      - name: Committed build matches the source
        run: |
          if [ -n "$(git status --porcelain -- src/ink/generated)" ]; then
            git status --short -- src/ink/generated
            echo "::error::src/ink/generated is out of date with crates/nv-ink. Take the files from this run's ink-wasm artifact (or run scripts/build-ink-wasm.sh on Linux) and commit them."
            exit 1
          fi

      - name: Upload the built files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-wasm
          path: src/ink/generated/
          retention-days: 7

  ink-ios:
    name: ink ios
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Build the ink engine for iOS
        run: bash scripts/build-ink-ios.sh
      - name: Swift tests (pen layer model and engine binding)
        working-directory: apps/mobile/ios/App/NvInk
        run: swift test 2>&1 | tail -n 60
      - name: Build the pen layer for the iOS simulator (its UIKit and Metal code)
        working-directory: apps/mobile/ios/App/NvInk
        run: |
          xcodebuild -scheme NvInk -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error|warning: .*NvInk|BUILD" | head -n 80
          test "${PIPESTATUS[0]}" -eq 0
