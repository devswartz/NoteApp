name: Publish image

# Contract (docs/DEPLOY_CONTRACT.md):
#   push to main      -> ghcr.io/devswartz/noteapp:staging + :sha-<short>
#   tag vX.Y.Z        -> ghcr.io/devswartz/noteapp:vX.Y.Z  + :prod
#   (a pre-release tag like v1.2.0-rc.1 gets its own tag but never :prod)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Don't cancel: every merge should leave its :sha-<short> tag behind for rollbacks.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/devswartz/noteapp

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ steps.sha.outputs.short }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=prod,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: |
            type=gha,scope=noteapp
            type=gha,scope=noteapp-ci
          cache-to: type=gha,mode=max,scope=noteapp

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
