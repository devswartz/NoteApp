name: Windows native
# The native Windows app of the rewrite (apps/windows, WinUI 3, .NET 8, single-project MSIX). Builds x64 Release and packages an
# unsigned MSIX on every push to a rewrite branch (and PRs) that touches it, then uploads it as a short-lived artifact.
# No signing, no Store identity, no upload anywhere: the packages (x64, arm64) are unsigned and sideload with Add-AppxPackage -AllowUnsigned (SIDELOAD.md).
# The app compiles the core's C# bindings and ships nv_core.dll, so the job first builds the core with
# crates/nv-core/build-windows.sh (the same script as windows-core.yml). It runs on core changes too.
on:
  workflow_dispatch:
  push:
    branches: ['rewrite/**']
    paths: ['apps/windows/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows.yml']
  pull_request:
    paths: ['apps/windows/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows.yml']

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same toolchain and generator as windows-core.yml / rust.yml.
  RUST_TOOLCHAIN: '1.99.1'
  UNIFFI_BINDGEN_CS_TAG: 'v0.12.0+v0.32.0'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: windows (x64 + arm64 build, unsigned MSIX)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache uniffi-bindgen-cs
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ env.RUST_TOOLCHAIN }}
      - name: Install uniffi-bindgen-cs
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --locked --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG"

      - name: Build nv_core.dll (x64, arm64) and the C# bindings
        run: bash crates/nv-core/build-windows.sh

      - name: Unit tests (box text view model)
        run: dotnet test apps/windows/Notivelo.Windows.Tests/Notivelo.Windows.Tests.csproj -c Release

      - name: Restore
        run: |
          dotnet restore apps/windows/Notivelo.Windows.sln

      - name: Build x64 Release
        run: dotnet build apps/windows/Notivelo.Windows.sln -c Release -p:Platform=x64

      - name: Build arm64 Release
        run: dotnet build apps/windows/Notivelo.Windows.sln -c Release -p:Platform=ARM64

      # Sideloadable without a certificate: Windows 11 installs an unsigned package with `Add-AppxPackage -AllowUnsigned` only when the manifest
      # Publisher carries the OID below. Patched here, in the CI checkout only; the committed manifest keeps Publisher="CN=Notivelo Dev".
      # See apps/windows/SIDELOAD.md.
      - name: Make the manifest Publisher accept unsigned installs (CI only)
        run: |
          m=apps/windows/Notivelo.Windows/Package.appxmanifest
          sed -i 's|Publisher="CN=Notivelo Dev"|Publisher="CN=Notivelo Dev, OID.2.25.311729368913984317654407730594956997722=1"|' "$m"
          grep -n '<Identity' "$m"
          grep -q 'OID.2.25.311729368913984317654407730594956997722=1' "$m"

      - name: Package MSIX (x64, unsigned)
        run: >
          dotnet build apps/windows/Notivelo.Windows/Notivelo.Windows.csproj -c Release -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir="$GITHUB_WORKSPACE/msix/x64/"

      - name: Package MSIX (arm64, unsigned)
        run: >
          dotnet build apps/windows/Notivelo.Windows/Notivelo.Windows.csproj -c Release -p:Platform=ARM64
          -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false
          -p:AppxPackageDir="$GITHUB_WORKSPACE/msix/arm64/"

      - uses: actions/upload-artifact@v4
        with:
          name: notivelo-windows-x64-msix-unsigned
          path: msix/x64/**/*.msix
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: notivelo-windows-arm64-msix-unsigned
          path: msix/arm64/**/*.msix
          if-no-files-found: error
          retention-days: 14

  # The input checks that used to be a manual list: FlaUI (UIA3) drives the real app with real keys and the mouse. The app is built
  # unpackaged (no MSIX identity needed) and started in its offline test mode (NOTIVELO_SOURCE=offline: no server, a fixed page of
  # boxes over local documents). Needs the runner's interactive desktop; screenshots of failures are kept for 3 days, the look screenshots (LookShots) for 7.
  windows-uitest:
    name: windows UI tests (FlaUI, offline mode)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NV_TARGETS: x86_64-pc-windows-msvc
      NOTIVELO_EXE: ${{ github.workspace }}\out-ui\Notivelo.exe
      UITEST_SHOTS: ${{ github.workspace }}\uitest-shots
      LOOK_SHOTS: ${{ github.workspace }}\look-shots
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-uitest

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache uniffi-bindgen-cs
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-${{ env.UNIFFI_BINDGEN_CS_TAG }}-${{ env.RUST_TOOLCHAIN }}
      - name: Install uniffi-bindgen-cs
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --locked --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag "$UNIFFI_BINDGEN_CS_TAG"

      - name: Build nv_core.dll (x64) and the C# bindings
        run: bash crates/nv-core/build-windows.sh

      - name: Build the app (x64 Release, unpackaged)
        run: >
          dotnet build apps/windows/Notivelo.Windows/Notivelo.Windows.csproj -c Release -p:Platform=x64
          -p:WindowsPackageType=None -o "$GITHUB_WORKSPACE/out-ui"

      - name: Desktop info
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "$($_.DeviceName) $($_.Bounds) primary=$($_.Primary)" }
          "session: $env:SESSIONNAME; user: $env:USERNAME"
          "ctfmon: " + ((Get-Process ctfmon -ErrorAction SilentlyContinue | Measure-Object).Count)
          "languages: " + ((Get-WinUserLanguageList | ForEach-Object { $_.LanguageTag }) -join ",")
          (Get-Service TabletInputService -ErrorAction SilentlyContinue | Out-String)

      - name: UI tests
        timeout-minutes: 25
        run: dotnet test apps/windows/Notivelo.Windows.UiTests/Notivelo.Windows.UiTests.csproj -c Release --filter "FullyQualifiedName!~LookShots" --logger "console;verbosity=normal"

      # Screenshots of every screen (1180x820, light and hybrid) from the offline sample data, for the look comparison. Never fails the job.
      - name: Look screenshots
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: dotnet test apps/windows/Notivelo.Windows.UiTests/Notivelo.Windows.UiTests.csproj -c Release --no-build --filter "FullyQualifiedName~LookShots" --logger "console;verbosity=normal"

      - name: Collect app logs
        if: always()
        run: |
          mkdir -p uitest-shots
          cp "$TEMP"/notivelo-*.log uitest-shots/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uitest-screenshots
          path: uitest-shots/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-look-screenshots
          path: look-shots/
          if-no-files-found: ignore
          retention-days: 7
