name: Apple native
# The native iPad/iPhone and Mac apps of the rewrite (apps/apple, XcodeGen). Builds both on every push to a rewrite branch
# that touches them. Uploads the iPad/iPhone build to TestFlight as 1.99.x (prototype builds, docs/rewrite/PLAN.md) when:
#   - a pushed commit message contains [testflight], or
#   - it is run by hand with "testflight" ticked (manual runs need this file on the default branch).
# Never submits anything to App Review. Signing works like mobile.yml: cloud-managed signing with the App Store Connect key.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the iPad/iPhone build to TestFlight as 1.99.x
        type: boolean
        default: false
  push:
    branches: ['rewrite/**']
    paths: ['apps/apple/**', 'crates/**', 'Cargo.*', '.github/workflows/apple-native.yml']

permissions:
  contents: read
  actions: read # gh run list, to read mobile.yml's build counter

concurrency:
  group: apple-native-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MARKETING_VERSION_BASE: '1.99'
  RUST_TOOLCHAIN: '1.99.1' # as rust.yml

jobs:
  apple:
    name: apple (iPad/iPhone + Mac build; TestFlight on request)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.testflight) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-native

      # The NotiveloCore Swift package (target/apple/NotiveloCore), linked by apps/apple/project.yml.
      - name: Build the core
        run: bash crates/nv-core/build-xcframework.sh

      - name: XcodeGen
        run: |
          brew install xcodegen
          cd apps/apple && xcodegen generate

      # Version 1.99.<run> keeps prototypes apart from real releases (1.5.x, 1.6 …).
      # Build number "<mobile.yml's latest run>.<this run>": mobile.yml uploads github.run_number as the build number, so ours is
      # higher than every build already uploaded for com.devswartz.notivelo, unique per run, and always lower than mobile.yml's next
      # build (N+1 > N.M), so real releases are never blocked.
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MOBILE_RUN="$(gh run list -R "$GITHUB_REPOSITORY" --workflow mobile.yml --limit 1 --json number -q '.[0].number')"
          if ! [[ "$MOBILE_RUN" =~ ^[0-9]+$ ]]; then echo "::error::could not read mobile.yml's run number"; exit 1; fi
          echo "MARKETING_VERSION=$MARKETING_VERSION_BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$MOBILE_RUN.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Version $MARKETING_VERSION_BASE.$GITHUB_RUN_NUMBER, build $MOBILE_RUN.$GITHUB_RUN_NUMBER"

      - name: iPad/iPhone simulator build
        working-directory: apps/apple
        run: |
          xcodebuild -project Notivelo.xcodeproj -scheme Notivelo -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-build.log" 2>&1             || { grep -E "error:" "$RUNNER_TEMP/ios-build.log" | sort -u | head -n 120; tail -n 30 "$RUNNER_TEMP/ios-build.log"; exit 1; }
          grep -E "warning:.*Sources/iOS" "$RUNNER_TEMP/ios-build.log" | sort -u | head -n 40 || true
          tail -n 5 "$RUNNER_TEMP/ios-build.log"

      # The look step (docs/rewrite/LOOK.md): the native app in the states of docs/rewrite/look/reference/ at the same
      # viewports (iPad 820×1180 pt portrait and landscape, iPhone 390×844 pt), and side-by-side pictures (reference | native).
      # Artifacts "look-side-by-side" and "look-native". Corpus mode only: no network, no credentials.
      - name: Look (native screenshots, side-by-sides)
        continue-on-error: true
        timeout-minutes: 20
        run: bash apps/apple/scripts/look-shots.sh "$RUNNER_TEMP/dd-ios/Build/Products/Debug-iphonesimulator/Notivelo.app" "$RUNNER_TEMP/look"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: look-side-by-side
          path: ${{ runner.temp }}/look/side-by-side/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: look-native
          path: ${{ runner.temp }}/look/native/
          if-no-files-found: ignore
          retention-days: 14

      # Typing evidence: -demoEdit focuses the first box and types through the same UITextInput calls as the keyboard
      # (a "- " list rule, Return, and an open IME composition), on a corpus page edited locally (nothing is sent).
      - name: iPad typing screenshots
        continue-on-error: true
        run: |
          UDID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPad Pro"))][0].udid')"
          [ -n "$UDID" ] && [ "$UDID" != null ] || { echo "::warning::no iPad simulator"; exit 0; }
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd-ios/Build/Products/Debug-iphonesimulator/Notivelo.app"
          mkdir -p "$RUNNER_TEMP/shots"
          for page in canvas-boxes tasks; do
            xcrun simctl launch "$UDID" com.devswartz.notivelo -previewSignedIn YES -page "$page" -demoEdit YES > /dev/null && sleep 8
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/edit-$page.png"
            xcrun simctl terminate "$UDID" com.devswartz.notivelo || true
          done
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-screenshots
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mac build
        working-directory: apps/apple
        run: |
          xcodebuild -project Notivelo.xcodeproj -scheme NotiveloMac -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-mac" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/mac-build.log" 2>&1             || { grep -E "error:" "$RUNNER_TEMP/mac-build.log" | sort -u | head -n 80; tail -n 30 "$RUNNER_TEMP/mac-build.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/mac-build.log"

      # Same certificate housekeeping as mobile.yml (scripts/ios-revoke-ci-certs.mjs, docs/IOS-SIGNING.md).
      - name: Revoke leftover CI development certificates
        if: env.HAS_ASC == 'true' && env.UPLOAD == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ios-revoke-ci-certs.mjs

      - name: Archive and upload to TestFlight
        if: env.HAS_ASC == 'true' && env.UPLOAD == 'true'
        working-directory: apps/apple
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Notivelo.xcodeproj -scheme Notivelo -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Notivelo.xcarchive" \
            "${AUTH[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive | tail -n 60
          for dest in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$dest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$dest</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          PLIST
          done
          # A local .ipa first, so the signature and version can be checked before anything is uploaded.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Notivelo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -n 40
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          APP="$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app | head -1)"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion'
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=|TeamIdentifier=" || true
          if ! codesign -dvv "$APP" 2>&1 | grep -q "Authority=Apple Distribution"; then
            echo "::error::the app is not signed with an Apple Distribution certificate"; exit 1
          fi
          case "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" in
            1.99.*) ;;
            *) echo "::error::prototype builds must be version 1.99.x"; exit 1 ;;
          esac
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Notivelo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" -exportPath "$RUNNER_TEMP/upload" "${AUTH[@]}" | tail -n 40
          rm -f "$KEY"
          echo "::notice::Uploaded Notivelo $MARKETING_VERSION ($BUILD_NUMBER) to TestFlight (internal testing only)."

      - name: Revoke the development certificate this run created
        if: always() && env.HAS_ASC == 'true' && env.UPLOAD == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node scripts/ios-revoke-ci-certs.mjs

      # Read-only: Apple's processing state of the latest uploads (did earlier 1.99.x builds go through?).
      - name: Recent TestFlight builds
        if: always() && env.HAS_ASC == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node apps/apple/scripts/testflight-builds.mjs 10

      - name: TestFlight skipped
        if: env.HAS_ASC != 'true' && env.UPLOAD == 'true'
        run: echo "::notice::App Store Connect secrets are not set; skipped the TestFlight upload."
