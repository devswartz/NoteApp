name: Mobile

# iPhone + Android builds of the Capacitor shell (apps/mobile). Separate from
# ci.yml so the main PR check stays fast: PRs run this only when they touch the
# mobile project. Secrets are optional and documented in docs/MOBILE.md; steps
# that need a missing secret are skipped, never failed.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the iOS build to TestFlight (needs the App Store Connect secrets)
        type: boolean
        default: false
      server_url:
        description: Server the app talks to
        default: https://notes.devswartz.com
  push:
    tags: ['v*.*.*', 'mobile-v*']
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'src/platform/capacitor.ts'
      - 'src/platform/index.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

# `shell: bash` runs with -o pipefail, so `xcodebuild … | tail` still fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MOBILE_SERVER_URL: ${{ inputs.server_url || 'https://notes.devswartz.com' }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: android (debug APK; signed release APK on tags)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # attach Notivelo.apk to the tag's release
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci --no-audit --no-fund

      - name: Version
        run: |
          v=$(node -p "process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME.replace(/^(mobile-)?v/, '') : require('./package.json').version")
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Build web app and sync
        run: |
          npm run mobile:build
          cd apps/mobile && npx cap sync android && node scripts/identity.mjs

      - name: Firebase config (push notifications)
        if: env.HAS_FIREBASE == 'true'
        run: printf '%s' "$GOOGLE_SERVICES" > apps/mobile/android/app/google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}

      - name: Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: noteapp-android-debug-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Signed release build: the .aab for Play internal testing and a .apk for direct download.
      # Without the keystore secrets (docs/ANDROID-SIGNING.md) this is skipped with a warning.
      - name: Signed release bundle and APK
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        working-directory: apps/mobile/android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/apk/Notivelo.apk"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Release APK skipped
        if: env.HAS_KEYSTORE != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo "::warning::The Android signing secrets are not set; skipped the signed release APK (see docs/ANDROID-SIGNING.md)."

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true' && github.event_name != 'pull_request'
        with:
          name: noteapp-android-release-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            ${{ runner.temp }}/apk/Notivelo.apk
          retention-days: 30

      # Attach the APK to the tag's GitHub release. The Desktop workflow makes a draft release for
      # the same tag at about the same time, so create it here if it isn't there yet and retry:
      # whichever workflow gets there first wins, and both just upload their files.
      - name: Attach Notivelo.apk to the release
        if: env.HAS_KEYSTORE == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in 1 2 3 4 5; do
            gh release view "$TAG" >/dev/null 2>&1               || gh release create "$TAG" --draft --title "$TAG" --notes "Build of $TAG. Publish this draft to ship it." --target "$GITHUB_SHA" >/dev/null 2>&1               || true
            if gh release upload "$TAG" "$RUNNER_TEMP/apk/Notivelo.apk" --clobber; then exit 0; fi
            sleep 10
          done
          echo "::error::Could not attach Notivelo.apk to release $TAG"
          exit 1

  ios:
    name: ios (simulator build; TestFlight when configured)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_DIST: ${{ secrets.IOS_DIST_P12 != '' && secrets.IOS_DIST_P12_PASSWORD != '' && secrets.IOS_PROFILE_APP != '' && secrets.IOS_PROFILE_SHARE != '' && secrets.IOS_PROFILE_WIDGET != '' }}
      UPLOAD: ${{ github.event_name == 'push' || inputs.testflight }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Newest stable Xcode on the image (App Store uploads need the current SDK).
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          xcodebuild -version

      - run: npm ci --no-audit --no-fund

      - name: Version
        run: |
          v=$(node -p "process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME.replace(/^(mobile-)?v/, '') : require('./package.json').version")
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Build web app and sync
        run: |
          npm run mobile:build
          cd apps/mobile && npx cap sync ios && node scripts/identity.mjs

      # Unsigned: proves the project, Swift code and extensions compile.
      - name: Simulator build
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 80

      # Signing with a stored Apple Distribution certificate and App Store profiles (secrets IOS_DIST_P12,
      # IOS_DIST_P12_PASSWORD, IOS_PROFILE_APP / _SHARE / _WIDGET, made once by scripts/ios-signing-setup.mjs; see
      # docs/IOS-SIGNING.md). Everything lives in a temporary keychain on this runner, so nothing is minted per run: automatic
      # signing created a new Apple Development certificate on every fresh runner until the account hit its limit, and cloud
      # signing with an API key could not archive with a Distribution identity or keep the App Group entitlements.
      - name: Archive (manual signing, Apple Distribution) and export
        if: env.HAS_ASC == 'true' && env.UPLOAD == 'true' && env.HAS_DIST == 'true'
        working-directory: apps/mobile/ios/App
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_APP: ${{ secrets.IOS_PROFILE_APP }}
          IOS_PROFILE_SHARE: ${{ secrets.IOS_PROFILE_SHARE }}
          IOS_PROFILE_WIDGET: ${{ secrets.IOS_PROFILE_WIDGET }}
        run: |
          set -euo pipefail
          # A temporary keychain with the distribution certificate.
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC"

          # The App Store profiles: installed by UUID; their names go to the build settings and the export options.
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          install_profile() { # $1 = base64 profile, $2 = variable prefix; sets $2_NAME and $2_BUNDLE
            local f="$RUNNER_TEMP/$2.mobileprovision" plist="$RUNNER_TEMP/$2.plist"
            printf '%s' "$1" | base64 --decode > "$f"
            security cms -D -i "$f" > "$plist"
            local uuid; uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            cp "$f" "$PROFILES/$uuid.mobileprovision"
            printf -v "$2_NAME" '%s' "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            printf -v "$2_BUNDLE" '%s' "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist" | sed "s/^[A-Z0-9]*\.//")"
            echo "profile $uuid: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist") ($(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist"))"
          }
          install_profile "$IOS_PROFILE_APP" APP
          install_profile "$IOS_PROFILE_SHARE" SHARE
          install_profile "$IOS_PROFILE_WIDGET" WIDGET

          # Archive: manual signing with the Distribution identity and a profile per target. The three targets are told apart
          # by PRODUCT_NAME (App, ShareExtension, TodayWidget), so one command-line setting picks each target's own profile.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            PROFILE_App="$APP_NAME" PROFILE_ShareExtension="$SHARE_NAME" PROFILE_TodayWidget="$WIDGET_NAME" \
            'PROVISIONING_PROFILE_SPECIFIER=$(PROFILE_$(PRODUCT_NAME))' \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive | tail -n 60

          # Export: manual signing, each bundle id mapped to its profile. First a local .ipa to check, then the upload.
          for dest in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$dest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$dest</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${APP_BUNDLE}</key><string>${APP_NAME}</string>
              <key>${SHARE_BUNDLE}</key><string>${SHARE_NAME}</string>
              <key>${WIDGET_BUNDLE}</key><string>${WIDGET_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          done
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" -exportPath "$RUNNER_TEMP/export" | tail -n 40
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          for bundle in "$RUNNER_TEMP"/ipa/Payload/*.app "$RUNNER_TEMP"/ipa/Payload/*.app/PlugIns/*.appex; do
            echo "== $bundle"
            codesign -dvv "$bundle" 2>&1 | grep -E "Authority=|TeamIdentifier=" || true
            codesign -d --entitlements - "$bundle" 2>/dev/null | grep -E "application-groups|aps-environment|associated-domains" || true
            if ! codesign -dvv "$bundle" 2>&1 | grep -q "Authority=Apple Distribution"; then
              echo "::error::$(basename "$bundle") is not signed with an Apple Distribution certificate"; exit 1
            fi
            if ! codesign -d --entitlements - "$bundle" 2>/dev/null | grep -q "application-groups"; then
              echo "::error::$(basename "$bundle") lost its App Group entitlement"; exit 1
            fi
          done
          if ! codesign -d --entitlements - "$RUNNER_TEMP"/ipa/Payload/*.app 2>/dev/null | grep -q "aps-environment"; then
            echo "::error::the app lost its push (aps-environment) entitlement"; exit 1
          fi
          # Upload (the API key authenticates the upload; it signs nothing).
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          rm -f "$KEY"

      # The runner is thrown away, but take the certificate and profiles off it anyway.
      - name: Remove the signing keychain and profiles
        if: always() && env.KEYCHAIN != ''
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: TestFlight signing secrets missing
        if: env.HAS_ASC == 'true' && env.UPLOAD == 'true' && env.HAS_DIST != 'true'
        run: |
          echo "::error::IOS_DIST_P12, IOS_DIST_P12_PASSWORD and the IOS_PROFILE_* secrets are not set: run scripts/ios-signing-setup.mjs (docs/IOS-SIGNING.md)."
          exit 1

      - name: TestFlight skipped
        if: env.HAS_ASC != 'true' && env.UPLOAD == 'true'
        run: echo "::notice::App Store Connect secrets are not set; skipped the TestFlight upload (see docs/MOBILE.md)."
