# Desktop app (Tauri 2, apps/desktop): macOS universal + Windows installers.
#
# Runs on version tags (v1.2.3) and by hand (Actions → Desktop → Run workflow).
# Never on pull requests, so it doesn't slow down or gate the main CI.
# Artifacts go to a DRAFT GitHub Release for the tag; publishing the draft is
# what makes an update visible to the in-app updater.
#
# Signing is optional and per-secret (see docs/DESKTOP.md):
#   - no secrets           → unsigned builds, no auto-update
#   - TAURI_SIGNING_* + TAURI_UPDATER_PUBKEY → signed update bundles + latest.json
#   - APPLE_*              → Developer ID signed and notarised .app/.dmg
name: Desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Upload to a draft release (otherwise only workflow artifacts)'
        type: boolean
        default: false

permissions:
  contents: write # create the draft release and upload assets

env:
  # Release tag: the pushed tag, or desktop-<run> for a manual run.
  TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-{0}', github.run_number) }}
  # App version: the tag (tauri.mjs drops the "v"); manual runs keep package.json's.
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            rust_targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Unset secrets arrive as "": apps/desktop/scripts/tauri.mjs drops empty
      # ones so the bundler skips that signing step instead of failing.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # --ignore-scripts: better-sqlite3 (server only) would compile from source and fail on runners whose
      # Visual Studio is newer than node-gyp knows. Nothing the desktop build needs runs an install script.
      - run: npm ci --no-audit --no-fund --ignore-scripts

      # macOS code signing: import the Developer ID certificate into a temporary
      # keychain (only when the secret exists) and export the identity + notarisation
      # credentials for the Tauri bundler.
      - name: Apple signing setup
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No APPLE_CERTIFICATE secret: building an unsigned macOS app."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then echo "::error::No 'Developer ID Application' identity in APPLE_CERTIFICATE"; exit 1; fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          # Notarisation: an App Store Connect API key, or Apple ID + app-specific password.
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            { echo "APPLE_API_KEY=$APPLE_API_KEY"; echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"; } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::warning::Signed but NOT notarised: add APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8 or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID."
          fi

      - name: Build
        shell: bash
        run: npm run desktop:build -- ${{ matrix.args }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi.sig

  # Collects both platforms' bundles into one draft release and writes the
  # updater manifest (latest.json) when the bundles are signed.
  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Write latest.json
        run: node apps/desktop/scripts/latest-json.mjs bundles "${{ github.repository }}" "$TAG" > bundles/latest.json

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find bundles -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.exe' -o -name '*.msi' -o -name '*.sig' \) | sort)
          # The updater manifest only for version tags with signed bundles.
          if [[ "$TAG" == v* ]] && [ "$(jq '.platforms | length' bundles/latest.json)" -gt 0 ]; then files="$files bundles/latest.json"; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Desktop build of $TAG. Publish this draft to ship it to the in-app updater." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" $files --clobber
