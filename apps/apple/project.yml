# Native Apple apps (iPad/iPhone and Mac) of the rewrite. See README.md.
# Generate the Xcode project with `xcodegen generate` (CI does this; the .xcodeproj is not committed).
name: Notivelo
options:
  bundleIdPrefix: com.devswartz
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# The Rust core as a local Swift package, built by crates/nv-core/build-xcframework.sh (CI runs it before xcodegen).
packages:
  NotiveloCore:
    path: ../../target/apple/NotiveloCore

settings:
  base:
    # Prototype builds go to TestFlight as 1.99.x (docs/rewrite/PLAN.md); CI passes the real numbers.
    MARKETING_VERSION: "1.99.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Same App Store Connect app as today's iPhone/iPad and Mac App Store builds.
    PRODUCT_BUNDLE_IDENTIFIER: com.devswartz.notivelo
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    # The core's XCFramework has arm64 slices only (iOS device, simulator on Apple silicon, macOS).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
    # DEVELOPMENT_TEAM comes from CI (secrets.APPLE_TEAM_ID) or your local Xcode account.

targets:
  # iPad first, iPhone too (TARGETED_DEVICE_FAMILY 1,2).
  Notivelo:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      # The App Group store shared with the share extension and the Today widget (Sources/iOS/Extras.swift uses it).
      - path: Extensions/Shared
      - path: Resources
        excludes:
          - PrivacyInfo.xcprivacy
      # The privacy manifest (no tracking; the data the app collects and the required-reason APIs it uses) goes in the bundle.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The page-format corpus as sample pages (a folder reference: Notivelo.app/cases/<name>/page.bin …).
      - path: ../../tests/corpus/cases
        type: folder
        buildPhase: resources
    dependencies:
      - package: NotiveloCore
      # Embedded in Notivelo.app/PlugIns (same bundle IDs as today's app: com.devswartz.notivelo.ShareExtension / .TodayWidget).
      - target: ShareExtension
      - target: TodayWidget
    entitlements:
      path: Sources/iOS/Notivelo.entitlements
      properties:
        # Shared container with the share extension and widget, as today (apps/mobile/ios/App/App/App.entitlements).
        com.apple.security.application-groups:
          - group.com.devswartz.notivelo
        # Push reminders (APNs). Xcode switches this to production when exporting for TestFlight/App Store, as today's app.
        aps-environment: development
        # Universal links, the same domains as today's app (apps/mobile/ios/App/App/App.entitlements).
        com.apple.developer.associated-domains:
          - applinks:app.notiveloapp.com
          - applinks:staging.notiveloapp.com
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Notivelo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock the app and your locked pages with Face ID.
        NSCameraUsageDescription: Take a photo to put on a page.
        # notivelo://page/<id>, notivelo://w/<workspace>/p/<page> (the web's own paths); web addresses open through Associated Domains.
        CFBundleURLTypes:
          - CFBundleURLName: com.devswartz.notivelo
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - notivelo
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  # "Share to Notivelo" (PARITY row 246): queues the shared text or link in the App Group; the app makes the task or note.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShareExtension
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Extensions/ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Extensions/Shared
    entitlements:
      path: Extensions/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.devswartz.notivelo
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Notivelo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devswartz.notivelo.ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  # The Today widget (PARITY row 247): reads the snapshot the app writes to the App Group.
  TodayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/TodayWidget
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Extensions/TodayWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Extensions/Shared
    entitlements:
      path: Extensions/TodayWidget/TodayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.devswartz.notivelo
    info:
      path: Extensions/TodayWidget/Info.plist
      properties:
        CFBundleDisplayName: Notivelo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devswartz.notivelo.TodayWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        APPLICATION_EXTENSION_API_ONLY: YES

  # UI tests (iPhone and iPad simulators): a finger scrolls a long page. Run by scripts/scroll-test.sh in CI.
  NotiveloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Notivelo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.devswartz.notivelo.uitests
        TARGETED_DEVICE_FAMILY: "1,2"

  NotiveloMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
      - path: Resources
        excludes:
          - PrivacyInfo.xcprivacy
      # The privacy manifest (no tracking; the data the app collects and the required-reason APIs it uses) goes in the bundle.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The page-format corpus as sample pages (a folder reference: Notivelo.app/cases/<name>/page.bin …).
      - path: ../../tests/corpus/cases
        type: folder
        buildPhase: resources
    dependencies:
      - package: NotiveloCore
    entitlements:
      path: Sources/macOS/NotiveloMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Export as Markdown: the save panel.
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Sources/macOS/Info.plist
      properties:
        CFBundleDisplayName: Notivelo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLName: com.devswartz.notivelo
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - notivelo
    settings:
      base:
        PRODUCT_NAME: Notivelo
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Notivelo:
    build:
      targets:
        Notivelo: all
    test:
      config: Debug
      targets:
        - NotiveloUITests
    archive:
      config: Release
  NotiveloMac:
    build:
      targets:
        NotiveloMac: all
    archive:
      config: Release
