org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The Maven component of the certificate verifier must equal the rustls-platform-verifier-android crate's version in Cargo.lock.
# CI passes the value build-android.sh wrote (-PrustlsPlatformVerifierVersion=...); this is the default for local builds.
rustlsPlatformVerifierVersion=0.2.0
